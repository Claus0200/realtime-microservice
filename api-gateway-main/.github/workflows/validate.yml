name: Validate gateway
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Native gateway smoke checks
        run: python3 tests/smoke.py
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build the student Docker image
        run: docker build -t api-gateway-validation .
      - name: Docker gateway smoke checks
        run: python3 tests/smoke.py --docker-image api-gateway-validation
