version: "3.8"

services:
  vault:
    image: hashicorp/vault:1.21.0
    command: server

    environment:
      VAULT_ADDR: http://127.0.0.1:8200

    ports:
      - target: 8200
        published: 8200
        protocol: tcp
        mode: host

    configs:
      - source: vault_config
        target: /vault/config/config.hcl

    volumes:
      - vault_data:/vault/file

    networks:
      - backend

    deploy:
      replicas: 1

      placement:
        constraints:
          - node.role == manager

      restart_policy:
        condition: any
        delay: 5s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    hostname: rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: bizcord
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_NODENAME: rabbit@rabbitmq

    ports:
      - target: 5672
        published: 5672
        protocol: tcp
        mode: ingress
      - target: 15672
        published: 15672
        protocol: tcp
        mode: ingress

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    networks:
      - backend

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    deploy:
      replicas: 1

      placement:
        constraints:
          - node.role == manager

      restart_policy:
        condition: any
        delay: 5s

  realtime-communication:
    image: bizcord-realtime:${REALTIME_VERSION:-1.0.0}

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID: ${VAULT_ROLE_ID}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID}

    networks:
      - backend

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

    deploy:
      replicas: 2
      endpoint_mode: vip

      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0

      rollback_config:
        parallelism: 1
        order: start-first

      restart_policy:
        condition: any
        delay: 5s

  api-gateway:
    image: bizcord-gateway:${GATEWAY_VERSION:-1.0.0}

    build:
      context: ./api-gateway-main
      dockerfile: Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"

    ports:
      - target: 8080
        published: 9081
        protocol: tcp
        mode: ingress

    networks:
      - backend

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

    deploy:
      replicas: 2
      endpoint_mode: vip

      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0

      rollback_config:
        parallelism: 1
        order: start-first

      restart_policy:
        condition: any
        delay: 5s

networks:
  backend:
    driver: overlay

configs:
  vault_config:
    file: ./vault/config.hcl

volumes:
  rabbitmq_data:
  vault_data: