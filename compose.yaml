
services:
  vault:
    image: hashicorp/vault:1.21.0
    restart: unless-stopped

    ports:
      - "127.0.0.1:8200:8200"

    volumes:
      - ./vault/config.hcl:/vault/config/config.hcl:ro
      - vault_data:/vault/file

    command: server

    environment:
      VAULT_ADDR: http://127.0.0.1:8200

    networks:
      - backend

    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
    
    depends_on:
      vault-seed:
        condition: service_completed_successfully
  
  vault-seed:
    image: alpine:3.20
    restart: "no"

    volumes:
      - ./vault/seed:/seed:ro
      - vault_data:/vault/file

    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$$(ls -A /seed)"
        if [ -z "$$(ls -A /vault/file)" ]; then
          cp -a /seed/. /vault/file/
        fi

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bizcord-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: bizcord
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_NODENAME: rabbit@rabbitmq

    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    networks:
      - backend

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  realtime-communication:
    image: bizcord-realtime:${REALTIME_VERSION:-1.0.0}

    build:
      context: .
      dockerfile: apps/RealtimeCommunication-microservice/Dockerfile

    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      Keycloak_Authority: http://keycloak:8080/realms/bizcord

    ports:
      - "127.0.0.1:9080:8080"

    networks:
      - backend

    depends_on:
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  api-gateway:
    image: bizcord-gateway:${GATEWAY_VERSION:-1.0.0}

    build:
      context: ./api-gateway-main
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Keycloak_Authority: http://keycloak:8080/realms/bizcord

    ports:
      - "127.0.0.1:9081:8080"

    networks:
      - backend

    depends_on:
      realtime-communication:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: bizcord-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/data:/opt/keycloak/data
    ports:
    - "9082:8080"

networks:
  backend:
    driver: bridge

volumes:
  rabbitmq_data:
  vault_data:

 