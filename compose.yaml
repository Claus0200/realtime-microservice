services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bizcord-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: bizcord
      RABBITMQ_DEFAULT_PASS: bizcord

    ports:
      - "5672:5672"
      - "15672:15672"

    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 5s
      timeout: 5s
      retries: 10

  realtime-communication:
    build:
      context: .
      dockerfile: apps/RealtimeCommunication-microservice/Dockerfile

    ports:
      - "9080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__RabbitMq: host=rabbitmq;username=bizcord;password=bizcord
      Keycloak__Authority: http://keycloak:8080/realms/bizcord

    depends_on:
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build:
      context: ./api-gateway-main
      dockerfile: Dockerfile
    ports:
      - "9081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Keycloak__Authority: http://keycloak:8080/realms/bizcord
    depends_on:
      - realtime-communication
      - keycloak

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: bizcord-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/data:/opt/keycloak/data
    ports:
    - "9082:8080"