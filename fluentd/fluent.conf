<source>
  @type tail
  @id docker_container_logs

  path /fluentd/log/containers/*/*-json.log

  pos_file /fluentd/log/docker-containers.pos
  tag docker.containers

  read_from_head true
  refresh_interval 1

  <parse>
    @type json
  </parse>
</source>

<match docker.containers>
  @type stdout
</match>